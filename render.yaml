services:
  - type: web
    name: smt-api
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm run --workspace=@self/server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: '*'
