<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Background Squircle Gradient (Signature Indigo to Violet) -->
    <linearGradient id="smt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Mastery Spark Radiant Gradient (Golden Dawn) -->
    <linearGradient id="smt-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Squircle Base for High Contrast on Dark and Light Browser Tabs -->
  <rect width="32" height="32" rx="7.5" fill="url(#smt-bg)" />

  <!-- The Execution Checkmark (Daily Momentum & Habits) -->
  <path
    d="M 7.5 17 L 12.5 22 L 20 14.5"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- The Mastery Spark (Cultivated Skills & Continuous Growth) -->
  <path
    d="M 22.5 4 C 22.5 6.2 24.3 8 26.5 8.5 C 24.3 9 22.5 10.8 22.5 13 C 22.5 10.8 20.7 9 18.5 8.5 C 20.7 8 22.5 6.2 22.5 4 Z"
    fill="url(#smt-spark)"
  />
</svg>
